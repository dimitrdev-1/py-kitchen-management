{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm form-card mt-5">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4 fw-bold text-dark">Account Login</h3>
          <form method="post" class="django-custom-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3 fw-semibold">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
