{% extends "base.html" %}
{% block content %}
  <div class="card border-danger shadow-sm form-card mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body p-4">
      <h2 class="text-danger fw-bold mb-3">Remove Dish from Menu</h2>
      <p class="text-secondary fs-5">Are you sure you want to remove <strong
          class="text-dark">{{ object.name }}</strong> from the restaurant menu?</p>
      <form method="post" class="django-custom-form mt-4">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger flex-grow-1 fw-semibold">Delete Dish</button>
          <a href="{% url 'kitchen:dish-list' %}" class="btn btn-secondary px-4 fw-semibold">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
