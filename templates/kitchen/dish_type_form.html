{% extends "base.html" %}
{% block content %}
  <div class="card shadow-sm form-card mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body p-4">
      <h2 class="fw-bold text-dark mb-4">{% if object %}Update{% else %}Create{% endif %} Dish Type</h2>
      <form method="post" class="django-custom-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success flex-grow-1 fw-semibold">Save</button>
          <a href="{% url 'kitchen:dish-type-list' %}" class="btn btn-secondary px-4 fw-semibold">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
